name: Build Packages

# 只手动构建和验证。公开 Release 由维护者检查产物后另行发布；
# 本分支不持有更新签名私钥，不生成更新清单，也不沿用上游的公钥。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runner: macos-latest
            arch: aarch64
          - label: macOS (Intel)
            runner: macos-15-intel
            arch: x64
          - label: Windows (x64)
            runner: windows-latest
            arch: x64
          - label: Linux (x64)
            runner: ubuntu-24.04
            arch: amd64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装 Tauri、音频和打包依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev \
            rpm patchelf file wget xdg-utils

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 验证前端与发布配置
        run: pnpm test

      # 在目标系统原生构建。不传 --no-sign，保留 macOS 完整 ad-hoc 签名；
      # createUpdaterArtifacts=false，因此不需要任何更新签名 Secret。
      - name: 构建本机安装包
        run: pnpm tauri build --ci -- --locked

      - name: 验证 macOS 应用与 DMG 签名
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          verify_app() {
            local app_path="$1"
            codesign --verify --deep --strict --verbose=4 "$app_path"
            local signature_info
            signature_info="$(codesign -d --verbose=4 "$app_path" 2>&1)"
            echo "$signature_info"
            grep -q "Identifier=com.thomasdjmax.guotan-radar" <<< "$signature_info"
            grep -q "Signature=adhoc" <<< "$signature_info"
          }
          verify_app "target/release/bundle/macos/库存查询器.app"
          dmg_path="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          hdiutil verify "$dmg_path"
          mount_path="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_path" >/dev/null 2>&1 || true
            rmdir "$mount_path" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" "$dmg_path" >/dev/null
          verify_app "$mount_path/库存查询器.app"

      - name: 验证并安装 Linux 发布包
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb_path="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          rpm_path="$(find target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)"
          appimage_path="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$deb_path"
          test -n "$rpm_path"
          test -n "$appimage_path"
          deb_name="$(dpkg-deb -f "$deb_path" Package)"
          rpm_name="$(rpm -qp --queryformat '%{NAME}' "$rpm_path")"
          package_name_pattern='^[a-z0-9][a-z0-9+.-]*$'
          [[ "$deb_name" =~ $package_name_pattern ]]
          [[ "$rpm_name" =~ $package_name_pattern ]]
          test "$deb_name" = "guotan-radar"
          test "$rpm_name" = "guotan-radar"
          test -x "$appimage_path"
          sudo apt-get install -y "./$deb_path"
          dpkg-query -W -f='${Status}\n' guotan-radar | grep -qx 'install ok installed'

      - name: 静默安装并启动 Windows 发布包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw '没有找到 NSIS 安装包' }
          $installDir = Join-Path $env:RUNNER_TEMP 'guotan-radar-install'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS 安装失败：$($install.ExitCode)" }
          $app = Get-ChildItem $installDir -Filter 'guotan-radar.exe' -Recurse | Select-Object -First 1
          if (-not $app) { throw '安装完成后没有找到库存查询器主程序' }
          $running = Start-Process -FilePath $app.FullName -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($running.HasExited) { throw "应用启动后提前退出：$($running.ExitCode)" }
          } finally {
            if (-not $running.HasExited) { Stop-Process -Id $running.Id -Force }
          }

      # 包名使用固定 ASCII 前缀；不依赖中文 productName 的 bundler 文件名。
      - name: 整理安装包并生成校验值
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          version="$(node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')"
          if [ "$RUNNER_OS" = "macOS" ]; then
            dmg_path="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
            cp "$dmg_path" "release-assets/inventory-checker_${version}_${PACKAGE_ARCH}.dmg"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            installer_path="$(find target/release/bundle/nsis -maxdepth 1 -name '*.exe' -print -quit)"
            cp "$installer_path" "release-assets/inventory-checker_${version}_${PACKAGE_ARCH}-setup.exe"
          else
            deb_path="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
            rpm_path="$(find target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)"
            appimage_path="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
            cp "$deb_path" "release-assets/inventory-checker_${version}_${PACKAGE_ARCH}.deb"
            cp "$rpm_path" "release-assets/inventory-checker_${version}_${PACKAGE_ARCH}.rpm"
            cp "$appimage_path" "release-assets/inventory-checker_${version}_${PACKAGE_ARCH}.AppImage"
          fi
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
          const files = readdirSync('release-assets').filter(name => name !== 'SHA256SUMS.txt').sort();
          if (files.length === 0) throw new Error('没有可上传的安装包');
          const sums = files.map(name => `${createHash('sha256').update(readFileSync(`release-assets/${name}`)).digest('hex')}  ${name}`);
          writeFileSync('release-assets/SHA256SUMS.txt', `${sums.join('\n')}\n`);
          NODE

      - name: 上传已验证的安装包（仅 Actions artifact）
        uses: actions/upload-artifact@v4
        with:
          name: inventory-checker-${{ runner.os }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
